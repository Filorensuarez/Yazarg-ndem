name: YazarGundem Guncelle

on:
  workflow_dispatch:
  schedule:
    - cron: "15 */3 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Yazilari guncelle
        run: python scripts/update.py

      - name: Degisiklik varsa kaydet
        run: |
          git config user.name "YazarGundem Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/articles.json
          if git diff --cached --quiet; then
            echo "Yeni degisiklik yok."
          else
            git commit -m "Kose yazilarini otomatik guncelle"
            git push
          fi
